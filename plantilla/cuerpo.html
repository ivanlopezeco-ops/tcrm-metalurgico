<style>
:root{
  --azul:#414FB1;
  --azul-medio:#7079C7;
  --azul-suave:#A8AEDD;
  --azul-tenue:#EEF0FA;
  --tinta:#1F2430;
  --gris:#5B6472;
  --gris-claro:#8C95A4;
  --linea:#E3E7ED;
  --panel:#F7F8FB;
  --blanco:#FFFFFF;
  --verde:#1E8E5A;
  --rojo:#C0392B;
  --ambar:#B7791F;
  --titulo:"Segoe UI","Segoe UI Web",system-ui,-apple-system,sans-serif;
  --sub:"DIN Light","DIN Next W01 Light","DIN Alternate","Segoe UI Light",
        "Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--blanco);color:var(--tinta);
  font-family:var(--titulo);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
#app{max-width:1180px;margin:0 auto;padding:22px 22px 40px}

/* ---------- encabezado ---------- */
.cab{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:2px solid var(--azul);margin-bottom:20px}
.cab .t{flex:1 1 320px}
.cab h1{font-size:26px;font-weight:700;color:var(--azul);letter-spacing:-.01em}
.cab p{font-family:var(--sub);font-size:14.5px;color:var(--gris);margin-top:3px}
.logos{display:flex;align-items:center;gap:16px}
.logos img{height:34px;width:auto;display:block}

/* ---------- pestanas de modo ---------- */
.modos{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.modos button{background:var(--blanco);border:1px solid var(--linea);
  color:var(--gris);cursor:pointer;font-family:var(--titulo);font-size:14px;
  font-weight:600;padding:9px 18px;border-radius:6px;transition:.15s}
.modos button:hover{border-color:var(--azul-suave);color:var(--azul)}
.modos button[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);
  color:#fff}
.modos button:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* ---------- selector de lado ---------- */
.lado{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:640px){.lado{grid-template-columns:1fr}}
.lado button{text-align:left;background:var(--blanco);border:1.5px solid var(--linea);
  border-radius:8px;padding:12px 16px;cursor:pointer;transition:.15s;
  font-family:var(--titulo)}
.lado button:hover{border-color:var(--azul-suave)}
.lado button[aria-pressed="true"]{border-color:var(--azul);background:var(--azul-tenue)}
.lado button strong{display:block;font-size:15px;font-weight:700;color:var(--tinta)}
.lado button[aria-pressed="true"] strong{color:var(--azul)}
.lado button span{display:block;font-family:var(--sub);font-size:12.5px;
  color:var(--gris);margin-top:2px;line-height:1.35}
.lado button:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* ---------- cifras ---------- */
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px;background:var(--linea);border:1px solid var(--linea);
  border-radius:8px;overflow:hidden;margin-bottom:16px}
.cifra{background:var(--blanco);padding:14px 16px;text-align:center}
.cifra .k{font-family:var(--sub);font-size:13px;color:var(--gris);display:block;
  margin-bottom:4px}
.cifra .v{font-size:30px;font-weight:700;line-height:1.1;color:var(--azul)}
.cifra .v.pos{color:var(--verde)} .cifra .v.neg{color:var(--rojo)}
.cifra .n{font-family:var(--sub);font-size:11.5px;color:var(--gris-claro);
  display:block;margin-top:3px}

/* ---------- grilla ---------- */
.grilla{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:900px){.grilla{grid-template-columns:1fr}}
.caja{background:var(--blanco);border:1px solid var(--linea);border-radius:8px}
.caja+.caja{margin-top:14px}
.caja>h2{font-family:var(--sub);font-size:14px;font-weight:400;color:var(--tinta);
  padding:12px 16px;border-bottom:1px solid var(--linea)}
.cuerpo{padding:14px 16px}

/* ---------- listas ---------- */
.eyebrow{font-family:var(--sub);font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--gris-claro);margin:14px 0 6px}
.eyebrow:first-child{margin-top:0}
.opcion{display:flex;justify-content:space-between;gap:10px;width:100%;
  text-align:left;background:transparent;border:0;color:var(--tinta);
  cursor:pointer;padding:7px 10px;border-radius:5px;font-size:13.5px;
  font-family:var(--titulo);transition:.12s}
.opcion:hover{background:var(--panel)}
.opcion[aria-pressed="true"]{background:var(--azul-tenue);color:var(--azul);
  font-weight:600}
.opcion .pz{font-family:var(--sub);font-size:12px;color:var(--gris-claro)}
.opcion[aria-pressed="true"] .pz{color:var(--azul-medio)}
.opcion:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}

.paises{display:flex;flex-direction:column;gap:1px;max-height:290px;
  overflow-y:auto;padding-right:4px}
.pais{display:grid;grid-template-columns:15px 1fr auto;align-items:center;
  gap:9px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.pais:hover{background:var(--panel)}
.pais input{appearance:none;width:14px;height:14px;border:1.5px solid var(--gris-claro);
  border-radius:3px;cursor:pointer;position:relative;background:#fff}
.pais input:checked{background:var(--azul);border-color:var(--azul)}
.pais input:checked::after{content:"";position:absolute;left:4px;top:1px;
  width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg)}
.pais input:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.pais.off{color:var(--gris-claro)}
.pais .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pais .w{font-family:var(--sub);font-size:12.5px;color:var(--gris)}
.pais.off .w{color:var(--gris-claro)}

.acciones{display:flex;gap:8px;margin-top:10px}
.acciones button{flex:1;background:var(--blanco);border:1px solid var(--linea);
  color:var(--gris);font-family:var(--sub);font-size:12px;padding:7px 0;
  border-radius:5px;cursor:pointer;transition:.12s}
.acciones button:hover{border-color:var(--azul-suave);color:var(--azul)}
.acciones button:focus-visible{outline:2px solid var(--azul)}

/* ---------- grafico ---------- */
.gcab{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--linea)}
.gcab h2{font-family:var(--sub);font-size:15px;color:var(--tinta);padding:0;border:0}
.gcab .sub{font-family:var(--sub);font-size:12.5px;color:var(--gris-claro);
  display:block;margin-top:1px}
.check{display:flex;align-items:center;gap:7px;font-family:var(--sub);
  font-size:13px;color:var(--gris);cursor:pointer;white-space:nowrap}
.check input{appearance:none;width:34px;height:19px;border-radius:10px;
  background:var(--linea);position:relative;cursor:pointer;transition:.18s;flex:none}
.check input::after{content:"";position:absolute;top:2px;left:2px;width:15px;
  height:15px;border-radius:50%;background:#fff;transition:.18s;
  box-shadow:0 1px 2px rgba(0,0,0,.2)}
.check input:checked{background:var(--azul)}
.check input:checked::after{left:17px}
.check input:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
canvas{display:block;width:100%;height:330px}
@media(max-width:600px){canvas{height:250px}}
.claves{display:flex;gap:18px;flex-wrap:wrap;padding:0 16px 12px;
  font-family:var(--sub);font-size:12.5px;color:var(--gris)}
.claves div{display:flex;align-items:center;gap:7px}
.claves i{width:16px;height:3px;border-radius:2px;display:block}

/* ---------- selector de periodo ---------- */
.periodo{padding:12px 16px 14px;border-top:1px solid var(--linea)}
.pfila{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:9px;flex-wrap:wrap;gap:8px}
.pfila .et{font-family:var(--sub);font-size:12.5px;color:var(--gris)}
.pfila .rango{font-family:var(--sub);font-size:13px;color:var(--azul);
  font-weight:600}
.atajos{display:flex;gap:6px;flex-wrap:wrap}
.atajos button{background:var(--blanco);border:1px solid var(--linea);
  color:var(--gris);font-family:var(--sub);font-size:11.5px;padding:4px 11px;
  border-radius:12px;cursor:pointer;transition:.12s}
.atajos button:hover{border-color:var(--azul-suave);color:var(--azul)}
.atajos button[aria-pressed="true"]{background:var(--azul-tenue);
  border-color:var(--azul-suave);color:var(--azul);font-weight:600}
.atajos button:focus-visible{outline:2px solid var(--azul)}
.slider{position:relative;height:26px;margin:0 8px}
.slider .riel{position:absolute;top:11px;left:0;right:0;height:4px;
  background:var(--linea);border-radius:2px}
.slider .activo{position:absolute;top:11px;height:4px;background:var(--azul);
  border-radius:2px}
.slider input{position:absolute;top:6px;left:0;width:100%;height:14px;
  appearance:none;background:none;pointer-events:none;margin:0}
.slider input::-webkit-slider-thumb{appearance:none;width:16px;height:16px;
  border-radius:50%;background:#fff;border:2.5px solid var(--azul);
  cursor:grab;pointer-events:auto;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.slider input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
  background:#fff;border:2.5px solid var(--azul);cursor:grab;
  pointer-events:auto;box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* ---------- composicion ---------- */
.barra{display:flex;height:30px;border-radius:5px;overflow:hidden;
  background:var(--panel)}
.seg{transition:flex-grow .4s cubic-bezier(.4,0,.2,1);min-width:0;
  display:flex;align-items:center;justify-content:center}
.seg span{font-family:var(--sub);font-size:11px;color:#fff;font-weight:600;
  white-space:nowrap;overflow:hidden}
.leyenda{display:flex;flex-wrap:wrap;gap:5px 16px;margin-top:10px;
  font-family:var(--sub);font-size:12.5px;color:var(--gris)}
.leyenda div{display:flex;align-items:center;gap:6px}
.leyenda i{width:9px;height:9px;border-radius:2px;display:block}
.leyenda b{color:var(--tinta);font-weight:600}

/* ---------- canasta propia ---------- */
.canasta{display:flex;flex-direction:column;gap:2px;max-height:340px;
  overflow-y:auto;padding-right:4px}
.fila{display:grid;grid-template-columns:1fr 66px 40px;align-items:center;
  gap:9px;padding:3px 6px;border-radius:4px}
.fila:hover{background:var(--panel)}
.fila .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila.cero .n{color:var(--gris-claro)}
.fila input{background:#fff;border:1px solid var(--linea);color:var(--tinta);
  font-family:var(--sub);font-size:13px;padding:5px 7px;border-radius:4px;
  width:100%;text-align:right}
.fila input:focus{outline:0;border-color:var(--azul)}
.fila .pc{font-family:var(--sub);font-size:12px;color:var(--gris);text-align:right}
.suma{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--linea);font-family:var(--sub);font-size:13px}
.suma .v{font-weight:600}
select{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:5px;
  font-family:var(--titulo);font-size:13.5px;color:var(--tinta);background:#fff;
  cursor:pointer}
select:focus{outline:2px solid var(--azul);outline-offset:-1px}

.nota{margin-top:12px;padding:10px 13px;border-left:3px solid var(--ambar);
  background:#FDF8EE;font-family:var(--sub);font-size:12.5px;color:var(--gris);
  border-radius:0 4px 4px 0;line-height:1.5}
.nota b{color:var(--ambar);font-weight:600}
.nota.info{border-color:var(--azul-suave);background:var(--azul-tenue)}
.nota.info b{color:var(--azul)}
.pie{margin-top:18px;padding-top:14px;border-top:1px solid var(--linea);
  font-family:var(--sub);font-size:12.5px;color:var(--gris-claro);line-height:1.6}
</style>

<script>
(function(){
const D=window.DATOS, G=D.grupos;
const PAL=['#414FB1','#5763BB','#6E78C6','#848DD0','#9BA2DA','#B1B7E5','#C8CCEF',
           '#8C95A4','#9DA5B2','#AEB5C0','#BFC5CE','#D0D4DB','#E1E4E9'];
const AZUL='#414FB1', AZUL2='#A8AEDD', GRIS='#9CA3AF';

const TEXTO_LADO={
  IMPO:{titulo:'Importaciones',
        bajada:'Qué tan caro resulta comprar afuera. Se pondera por el origen de las compras del sector.',
        sube:'Cuanto más alto, más caro importar y mejor compite la producción nacional.'},
  EXPO:{titulo:'Exportaciones',
        bajada:'Qué tan competitivo es vender afuera. Se pondera por el destino de las ventas del sector.',
        sube:'Cuanto más alto, más conveniente exportar frente a los competidores.'}
};

let modo='sector', lado='IMPO', preset='Total del intercambio',
    apagados=new Set(), verBCRA=false, granularidad='mensual',
    r0=null, r1=null, atajo='10a',
    canasta=Object.fromEntries(G.map(g=>[g,0])), comparar='Total del intercambio';

const $=s=>document.querySelector(s);
const fmt=v=>v==null?'—':v.toFixed(1).replace('.',',');

document.getElementById('app').innerHTML=`
<header class="cab">
  <div class="t">
    <h1>Tipo de cambio real metalúrgico</h1>
    <p>Cuánto vale el peso frente a las monedas con las que realmente comercia la metalurgia argentina</p>
  </div>
  <div class="logos">
    <img src="https://res.cloudinary.com/dst2iprcr/image/upload/v1778116908/LOGO_ADIMRA_PNG_pc5a15.png" alt="ADIMRA">
    <img src="https://res.cloudinary.com/dst2iprcr/image/upload/v1778116908/LOGO_ECONOMICOS_AZUL_kmxg0k.jpg" alt="Estudios Económicos">
  </div>
</header>

<div class="modos" role="group">
  <button id="mSector" aria-pressed="true">Índice del sector</button>
  <button id="mEmpresa" aria-pressed="false">Armá tu propio TCRM</button>
</div>

<div id="vista"></div>`;

/* ================= calculo ================= */
function norm(obj){
  const v=G.map(g=>Math.max(0,+obj[g]||0)), s=v.reduce((a,b)=>a+b,0);
  return s>0? v.map(x=>x/s):null;
}
function pesosSector(){
  const base=D.presets[lado][preset].w;
  const w=base.map((v,i)=>apagados.has(G[i])?0:v);
  const s=w.reduce((a,b)=>a+b,0);
  return s>0? w.map(v=>v/s):null;
}
function set(){ return granularidad==='diario'? D.diario : D.mensual; }

function encadenar(s,w){
  if(!w) return null;
  const n=s.fechas.length, y=new Array(n).fill(null);
  const col=G.map(g=>s.bil[g]);
  let acum=0, arranco=false;
  for(let t=0;t<n;t++){
    if(t>0){
      let d=0,pw=0;
      for(let j=0;j<G.length;j++){
        if(w[j]===0) continue;
        const a=col[j][t-1], b=col[j][t];
        if(a==null||b==null||a<=0||b<=0) continue;
        d+=w[j]*(Math.log(b)-Math.log(a)); pw+=w[j];
      }
      if(pw>0){ acum+=d/pw; arranco=true; }
    }
    let hay=false;
    for(let j=0;j<G.length;j++){ if(w[j]>0&&col[j][t]!=null){hay=true;break;} }
    if(hay&&(arranco||t===0)) y[t]=Math.exp(acum);
  }
  return y;
}
function anclar(y,fechas,esDiario,w){
  if(!y) return y;
  if(esDiario){
    let i=fechas.indexOf('2015-12-17');
    if(i<0||y[i]==null) for(let t=0;t<fechas.length;t++) if(fechas[t]>='2015-12-17'&&y[t]!=null){i=t;break;}
    if(i<0||y[i]==null) return y;
    const k=100/y[i]; return y.map(v=>v==null?null:v*k);
  }
  const d=D.diario;
  const yd=anclar(encadenar(d,w),d.fechas,true,w);
  if(!yd) return y;
  const prom={};
  d.fechas.forEach((f,t)=>{ if(yd[t]==null) return;
    const m=f.slice(0,7); (prom[m]=prom[m]||[]).push(yd[t]); });
  for(let t=0;t<fechas.length;t++){
    const m=fechas[t].slice(0,7);
    if(y[t]!=null&&prom[m]&&m>='2016-01'){
      const ref=prom[m].reduce((a,b)=>a+b,0)/prom[m].length;
      const k=ref/y[t];
      return y.map(v=>v==null?null:v*k);
    }
  }
  return y;
}
function oficial(nombre){
  const o=D.oficiales&&D.oficiales[granularidad==='diario'?'diario':'mensual'];
  return (o&&o[nombre])?o[nombre]:null;
}
const nombreSerie=(l,p)=> p==='Total del intercambio'? l+' total' : l+' - '+p;

function serie(w,nombreOficial){
  if(nombreOficial){ const o=oficial(nombreOficial); if(o) return o; }
  const s=set();
  return anclar(encadenar(s,w),s.fechas,granularidad==='diario',w);
}
function serieSector(){
  if(!apagados.size) return serie(null,nombreSerie(lado,preset));
  return serie(pesosSector(),null);
}

/* ================= periodo ================= */
const ejeFechas=()=>set().fechas;
function aplicarAtajo(a){
  const f=ejeFechas(); atajo=a;
  if(a==='todo'){ r0=0; r1=f.length-1; return; }
  const anios={'3a':3,'10a':10,'20a':20}[a]||10;
  const c=new Date(); c.setFullYear(c.getFullYear()-anios);
  const iso=c.toISOString().slice(0,10);
  let i=f.findIndex(d=>d>=iso); if(i<0) i=0;
  r0=i; r1=f.length-1;
}
function recorte(y){
  const f=ejeFechas();
  const a=Math.max(0,Math.min(r0,f.length-1)), b=Math.max(a+1,Math.min(r1,f.length-1));
  return {f:f.slice(a,b+1), y:y?y.slice(a,b+1):null};
}

/* ================= grafico ================= */
let lineas=[], fechas=[];
function dibujar(){
  const cv=document.getElementById('lienzo'); if(!cv) return;
  const cx=cv.getContext('2d');
  const dpr=devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
  const m={t:16,r:14,b:28,l:46}, pw=W-m.l-m.r, ph=H-m.t-m.b;
  const ff=getComputedStyle(document.body).fontFamily;
  const todos=lineas.flatMap(l=>l.y||[]).filter(v=>v!=null);
  if(!todos.length||fechas.length<2){
    cx.fillStyle='#8C95A4'; cx.font='13px '+ff; cx.textAlign='center';
    cx.fillText('Elegí al menos un país', W/2, H/2); return;
  }
  let lo=Math.min(...todos), hi=Math.max(...todos);
  const p=(hi-lo)*0.12||5; lo-=p; hi+=p;
  const X=i=>m.l+(i/(fechas.length-1))*pw, Y=v=>m.t+(1-(v-lo)/(hi-lo))*ph;

  cx.strokeStyle='#EDF0F4'; cx.lineWidth=1; cx.fillStyle='#8C95A4';
  cx.font='11px '+ff; cx.textAlign='right';
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4, y=Math.round(Y(v))+.5;
    cx.beginPath(); cx.moveTo(m.l,y); cx.lineTo(W-m.r,y); cx.stroke();
    cx.fillText(v.toFixed(0), m.l-8, y+4);
  }
  if(lo<100&&hi>100){
    const y=Math.round(Y(100))+.5;
    cx.save(); cx.setLineDash([4,4]); cx.strokeStyle='#C8CCEF';
    cx.beginPath(); cx.moveTo(m.l,y); cx.lineTo(W-m.r,y); cx.stroke(); cx.restore();
  }
  cx.textAlign='center';
  const paso=Math.max(1,Math.floor(fechas.length/6));
  for(let i=0;i<fechas.length;i+=paso)
    cx.fillText(fechas.length>400?fechas[i].slice(0,4):fechas[i].slice(0,7), X(i), H-9);

  lineas.forEach(l=>{
    if(!l.y) return;
    cx.strokeStyle=l.c; cx.lineWidth=l.w||2.2; cx.lineJoin='round'; cx.lineCap='round';
    cx.setLineDash(l.d||[]);
    cx.beginPath(); let mov=true;
    l.y.forEach((v,i)=>{ if(v==null){mov=true;return;}
      const x=X(i), y=Y(v); if(mov){cx.moveTo(x,y);mov=false;} else cx.lineTo(x,y); });
    cx.stroke(); cx.setLineDash([]);
  });
}

/* ================= vistas ================= */
function bloqueGrafico(titulo,sub,claves,conBCRA){
  return `<div class="caja">
    <div class="gcab">
      <div><h2>${titulo}</h2><span class="sub">${sub}</span></div>
      ${conBCRA?`<label class="check"><input type="checkbox" id="chkBCRA" ${verBCRA?'checked':''}>
        Ver también el índice original del BCRA</label>`:''}
    </div>
    <div class="cuerpo" style="padding-bottom:4px"><canvas id="lienzo"></canvas></div>
    <div class="claves">${claves}</div>
    <div class="periodo">
      <div class="pfila"><span class="et">Período</span><span class="rango" id="rangoTxt"></span></div>
      <div class="slider">
        <div class="riel"></div><div class="activo" id="act"></div>
        <input type="range" id="s0" min="0" step="1" aria-label="Desde">
        <input type="range" id="s1" min="0" step="1" aria-label="Hasta">
      </div>
      <div class="pfila" style="margin:10px 0 0">
        <div class="atajos" role="group">
          <button data-a="3a">3 años</button><button data-a="10a">10 años</button>
          <button data-a="20a">20 años</button><button data-a="todo">Todo</button>
        </div>
        <div class="atajos" role="group">
          <button data-g="mensual">Mensual</button><button data-g="diario">Diario</button>
        </div>
      </div>
    </div>
  </div>`;
}

function vistaSector(){
  const T=TEXTO_LADO[lado], P=D.presets[lado], out=[];
  const grupo=(t,tipo)=>{
    const it=Object.entries(P).filter(([,v])=>v.tipo===tipo);
    if(!it.length) return;
    out.push(`<p class="eyebrow">${t}</p>`);
    it.forEach(([k,v])=>out.push(`<button class="opcion" data-p="${k}" aria-pressed="${k===preset}">
      <span>${k}</span><span class="pz">${(v.peso*100).toFixed(tipo==='total'?0:1)}%</span></button>`));
  };
  grupo('Todo el sector','total');
  grupo('Por perfil de origen o destino','familia');
  grupo('Por rubro','rubro');

  return `
  <div class="lado" role="group">
    <button id="bImpo" aria-pressed="${lado==='IMPO'}"><strong>Importaciones</strong>
      <span>${TEXTO_LADO.IMPO.bajada}</span></button>
    <button id="bExpo" aria-pressed="${lado==='EXPO'}"><strong>Exportaciones</strong>
      <span>${TEXTO_LADO.EXPO.bajada}</span></button>
  </div>
  <div class="cifras" id="cifras"></div>
  <div class="grilla">
    <main>
      ${bloqueGrafico(preset==='Total del intercambio'? T.titulo+' del sector metalúrgico':preset,
        T.sube,
        `<div><i style="background:${AZUL}"></i>${preset} · ${T.titulo.toLowerCase()}</div>
         <div id="claveBCRA" style="display:${verBCRA?'flex':'none'}">
           <i style="background:${GRIS}"></i>Índice original del BCRA</div>`, true)}
      <div class="caja"><h2>Con qué países se compara el peso, y cuánto pesa cada uno</h2>
        <div class="cuerpo">
          <div class="barra" id="barra"></div>
          <div class="leyenda" id="leyenda"></div>
          <div id="aviso"></div>
        </div></div>
    </main>
    <aside>
      <div class="caja"><h2>Países de la canasta</h2>
        <div class="cuerpo">
          <div class="paises" id="paises"></div>
          <div class="acciones"><button id="bTodos">Todos</button><button id="bNinguno">Ninguno</button></div>
        </div></div>
      <div class="caja"><h2>Qué se está midiendo</h2>
        <div class="cuerpo"><div id="presets">${out.join('')}</div></div></div>
    </aside>
  </div>
  <p class="pie">Base 17 de diciembre de 2015 = 100. Cobertura del comercio del sector:
    <span id="cobTxt"></span>.</p>`;
}

function vistaEmpresa(){
  const P=D.presets[lado];
  const ops=Object.keys(P).map(k=>`<option value="${k}" ${k===comparar?'selected':''}>${k}</option>`).join('');
  return `
  <div class="lado" role="group">
    <button id="bImpo" aria-pressed="${lado==='IMPO'}"><strong>Mis compras al exterior</strong>
      <span>Cargá de qué países importás y con qué peso en tus compras.</span></button>
    <button id="bExpo" aria-pressed="${lado==='EXPO'}"><strong>Mis ventas al exterior</strong>
      <span>Cargá a qué países exportás y con qué peso en tus ventas.</span></button>
  </div>
  <div class="cifras" id="cifras"></div>
  <div class="grilla">
    <main>
      ${bloqueGrafico('Tu índice frente al del sector',
        'Cargá tus porcentajes a la derecha y elegí contra qué compararte.',
        `<div><i style="background:${AZUL}"></i>Tu canasta</div>
         <div><i style="background:${AZUL2}"></i>${comparar}</div>`, false)}
      <div class="caja"><h2>Comparar contra</h2>
        <div class="cuerpo"><select id="selComp">${ops}</select><div id="aviso"></div></div></div>
    </main>
    <aside>
      <div class="caja"><h2>Tu canasta, en porcentajes</h2>
        <div class="cuerpo">
          <div class="canasta" id="canastaLista"></div>
          <div class="suma"><span>Suma cargada</span><span class="v" id="suma">0</span></div>
          <div class="acciones"><button id="bProm">Promedio del sector</button>
            <button id="bBorrar">Borrar</button></div>
        </div></div>
    </aside>
  </div>
  <p class="pie">No hace falta que los porcentajes sumen 100: la columna de la derecha muestra
    la participación que efectivamente se usa. Solo aparecen los países que el índice cubre;
    si comerciás con otros, esa parte no se puede representar.</p>`;
}

/* ================= piezas ================= */
function pintarBarra(w){
  const b=$('#barra'); if(!b) return;
  const seg=w?G.map((g,i)=>[g,w[i]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]):[];
  b.innerHTML=seg.map(([g,v],k)=>
    `<div class="seg" style="flex:${v} 0 0;background:${PAL[k%PAL.length]}"
      title="${g}: ${(v*100).toFixed(1)}%"><span>${v>0.08?(v*100).toFixed(0)+'%':''}</span></div>`).join('');
  $('#leyenda').innerHTML=seg.slice(0,9).map(([g,v],k)=>
    `<div><i style="background:${PAL[k%PAL.length]}"></i>${g} <b>${(v*100).toFixed(1)}%</b></div>`).join('');
}

const ultimo=a=>{ if(!a) return null; for(let i=a.length-1;i>=0;i--) if(a[i]!=null) return a[i]; return null; };

function cifras(y,ref,etiqueta){
  const v=ultimo(y);
  if(v==null) return `<div class="cifra"><span class="k">${etiqueta}</span><span class="v">—</span>
    <span class="n">cargá tus porcentajes</span></div>`;
  const idx=[]; y.forEach((x,i)=>{ if(x!=null) idx.push(i); });
  const atras=k=>{ const i=idx[idx.length-1-k]; return i==null?null:y[i]; };
  const paso=granularidad==='diario'?21:1, anio=granularidad==='diario'?252:12;
  const d=(a,b)=>(a==null||b==null)?null:(a/b-1)*100;
  const vm=d(v,atras(paso)), va=d(v,atras(anio));
  const cls=x=>x==null?'':(x>0?'pos':'neg');
  const sg=x=>x==null?'—':(x>0?'+':'')+x.toFixed(1).replace('.',',')+'%';
  let h=`<div class="cifra"><span class="k">${etiqueta}</span><span class="v">${fmt(v)}</span>
      <span class="n">base dic-2015 = 100</span></div>
    <div class="cifra"><span class="k">Variación mensual</span>
      <span class="v ${cls(vm)}" style="font-size:26px">${sg(vm)}</span></div>
    <div class="cifra"><span class="k">Variación interanual</span>
      <span class="v ${cls(va)}" style="font-size:26px">${sg(va)}</span></div>`;
  if(ref!=null){
    const g=(v/ref-1)*100;
    h+=`<div class="cifra"><span class="k">Frente al sector</span>
      <span class="v ${cls(g)}" style="font-size:26px">${sg(g)}</span>
      <span class="n">sector: ${fmt(ref)}</span></div>`;
  }
  return h;
}

function sincronizarSlider(){
  const f=ejeFechas(), s0=$('#s0'), s1=$('#s1'); if(!s0) return;
  s0.max=s1.max=f.length-1; s0.value=r0; s1.value=r1;
  const a=r0/(f.length-1)*100, b=r1/(f.length-1)*100;
  $('#act').style.left=a+'%'; $('#act').style.width=(b-a)+'%';
  const et=x=>f[x].slice(0,7).replace('-','/');
  $('#rangoTxt').textContent=et(r0)+' — '+et(r1);
  document.querySelectorAll('.atajos [data-a]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.a===atajo));
  document.querySelectorAll('.atajos [data-g]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===granularidad));
}

/* ================= render ================= */
function render(foco){
  $('#mSector').setAttribute('aria-pressed',modo==='sector');
  $('#mEmpresa').setAttribute('aria-pressed',modo==='empresa');
  $('#vista').innerHTML = modo==='sector'? vistaSector() : vistaEmpresa();

  const f=ejeFechas();
  if(r0==null||r1==null||r1>f.length-1) aplicarAtajo(atajo||'10a');

  lineas=[];
  if(modo==='sector'){
    const rec=recorte(serieSector()); fechas=rec.f;
    if(verBCRA){ const b=recorte(set().itcrm); lineas.push({y:b.y,c:GRIS,w:1.6,d:[5,4]}); }
    lineas.push({y:rec.y,c:AZUL,w:2.4});
    $('#cifras').innerHTML=cifras(rec.y,null,'Índice');
    pintarBarra(pesosSector());

    const cob=D.presets[lado][preset].cobertura;
    $('#cobTxt').textContent=(cob*100).toFixed(1)+'%';
    let av='';
    if(cob<0.70) av=`<div class="nota"><b>Cobertura ${(cob*100).toFixed(1)}%.</b>
      Los países disponibles explican menos del 70% de este flujo, así que el dato es indicativo.</div>`;
    else if(apagados.size) av=`<div class="nota"><b>Canasta modificada.</b>
      Sacaste ${apagados.size} ${apagados.size>1?'países':'país'}. El resultado responde a qué
      competitividad habría si el sector comerciara solo con los que quedaron, y ya no es el
      índice del sector.</div>`;
    $('#aviso').innerHTML=av;

    const P=D.presets[lado][preset], w=pesosSector();
    const orden=G.map((g,i)=>[g,P.w[i],i]).sort((a,b)=>b[1]-a[1]);
    $('#paises').innerHTML=orden.map(([g,,i])=>{
      const off=apagados.has(g);
      return `<label class="pais ${off?'off':''}"><input type="checkbox" data-g="${g}" ${off?'':'checked'}>
        <span class="n">${g}</span><span class="w">${off?'—':((w?w[i]:0)*100).toFixed(1)+'%'}</span></label>`;
    }).join('');
    $('#paises').querySelectorAll('input').forEach(c=>c.onchange=()=>{
      c.checked?apagados.delete(c.dataset.g):apagados.add(c.dataset.g); render(); });
    $('#presets').querySelectorAll('.opcion').forEach(b=>b.onclick=()=>{preset=b.dataset.p;render();});
    $('#bTodos').onclick=()=>{apagados.clear();render();};
    $('#bNinguno').onclick=()=>{G.forEach(g=>apagados.add(g));render();};
    const ch=$('#chkBCRA'); if(ch) ch.onchange=()=>{verBCRA=ch.checked;render();};
  } else {
    const w=norm(canasta);
    const ry=recorte(serie(w,null)); fechas=ry.f;
    const rc=recorte(serie(null,nombreSerie(lado,comparar)));
    lineas.push({y:rc.y,c:AZUL2,w:2});
    lineas.push({y:ry.y,c:AZUL,w:2.4});
    $('#cifras').innerHTML=cifras(ry.y, w?ultimo(rc.y):null, 'Tu índice');

    $('#canastaLista').innerHTML=G.map((g,i)=>{
      const v=canasta[g]||0;
      return `<div class="fila ${v>0?'':'cero'}"><span class="n">${g}</span>
        <input type="number" min="0" step="1" data-g="${g}" value="${v||''}" placeholder="0" aria-label="${g}">
        <span class="pc">${w&&w[i]>0?(w[i]*100).toFixed(0)+'%':'—'}</span></div>`;
    }).join('');
    $('#suma').textContent=G.reduce((a,g)=>a+(+canasta[g]||0),0).toFixed(0);
    $('#canastaLista').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{
      canasta[inp.dataset.g]=Math.max(0,+inp.value||0); render(inp.dataset.g); });
    $('#selComp').onchange=e=>{comparar=e.target.value;render();};
    $('#bProm').onclick=()=>{const b=D.presets[lado]['Total del intercambio'].w;
      G.forEach((g,i)=>canasta[g]=Math.round(b[i]*1000)/10); render();};
    $('#bBorrar').onclick=()=>{G.forEach(g=>canasta[g]=0); render();};
    $('#aviso').innerHTML=`<div class="nota info">Tu canasta se compara contra <b>${comparar}</b>.
      Por encima significa que tu combinación de países te dejó mejor parado que al promedio;
      por debajo, peor.</div>`;
  }

  $('#bImpo').onclick=()=>{lado='IMPO';preset='Total del intercambio';comparar='Total del intercambio';apagados.clear();render();};
  $('#bExpo').onclick=()=>{lado='EXPO';preset='Total del intercambio';comparar='Total del intercambio';apagados.clear();render();};
  document.querySelectorAll('.atajos [data-a]').forEach(b=>b.onclick=()=>{aplicarAtajo(b.dataset.a);render();});
  document.querySelectorAll('.atajos [data-g]').forEach(b=>b.onclick=()=>{
    granularidad=b.dataset.g; aplicarAtajo(atajo||'10a'); render(); });
  const s0=$('#s0'), s1=$('#s1');
  if(s0){
    s0.oninput=()=>{ r0=Math.min(+s0.value,r1-1); atajo=''; render(); };
    s1.oninput=()=>{ r1=Math.max(+s1.value,r0+1); atajo=''; render(); };
  }
  sincronizarSlider();
  dibujar();

  if(foco){ const el=$(`input[data-g="${CSS.escape(foco)}"]`);
    if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }
}

$('#mSector').onclick=()=>{modo='sector';render();};
$('#mEmpresa').onclick=()=>{modo='empresa';render();};
addEventListener('resize',dibujar);
render();
})();
</script>
</body></html>
